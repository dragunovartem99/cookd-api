name: CI

on:
    pull_request:
        branches: ["main"]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "These files need gofmt:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Lint
              uses: golangci/golangci-lint-action@v8
              with:
                  version: v2.13

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test -race ./...

            - name: Build
              run: go build ./...
