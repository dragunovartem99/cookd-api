name: Deploy

on:
    push:
        branches: ["main"]
    workflow_dispatch:

jobs:
    # The binary is built on the runner, not the VPS: compiling the SQLite driver there took
    # minutes. Static (no CGO) for linux/amd64, so it runs in the distroless image as is.
    pipes:
        uses: dragunovartem99/pipes/.github/workflows/deploy-vps.yaml@v1.2.0
        with:
            setup: go
            build: 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/cookd-api ./cmd/cookd-api'
            upload: bin/cookd-api
            url: https://cookd.dragunov.dev
        secrets: inherit
