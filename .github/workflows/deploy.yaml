name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to VPS
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e
                      cd ${{ secrets.VPS_PROJECT_PATH }}
                      # The checkout is a deploy target, never a place to commit from:
                      # reset to the pushed tip so local drift can't block a deploy.
                      git fetch origin
                      git reset --hard origin/main
                      ./deploy.sh
